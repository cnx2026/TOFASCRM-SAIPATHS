<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOFASCRM — Sanalyzer Modülü</title>
    <!--
      Bu modül, panelin kendi görsel dilini (tasarim-v2) birebir kullanıyor.
      Sanalyzer'a eklenirken bu <link> etiketlerinin de <head>'e taşınması
      gerekir (yoksa modül sistem fontuna düşer, işlevi etkilenmez).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Bu sayfa iskeleti sadece YEREL geliştirme/önizleme (npm run dev) içindir.
      Sanalyzer'a eklendiğinde modül <App /> bileşeni olarak onların kendi
      sayfa çatısının içine mount edilir; bu dosyadaki <html>/<body>
      kullanılmaz.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
